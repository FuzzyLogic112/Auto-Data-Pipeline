name: 自动气象数据抓取流水线

# 什么时候触发这个流水线？
on:
  schedule:
    - cron: '0 0 * * *' # 每天国际标准时间0点（北京时间早8点）自动运行
  workflow_dispatch:    # 允许我们在网页上手动点击运行（方便测试）

jobs:
  run-data-pipeline:
    runs-on: ubuntu-latest # 给我们分配一台免费的云端 Linux 服务器
    permissions:
      contents: write      # 允许机器人把生成的数据文件存回仓库

    steps:
      - name: 步骤1：把仓库里的代码拉取到云服务器上
        uses: actions/checkout@v3

      - name: 步骤2：在服务器上安装 Python 环境
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 步骤3：安装代码依赖包
        run: pip install requests pandas

      - name: 步骤4：执行我们的爬虫脚本！
        run: python crawler.py

      - name: 步骤5：把抓取到的新数据表格保存（提交）回 GitHub
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add weather_data.csv
          git commit -m "🤖 自动更新天气数据" || exit 0
          git push