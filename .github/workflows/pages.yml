name: 发布迁移跳转页到 GitHub Pages

# 《Claude 红皮书》已迁到 FuzzyLogic112/claude-red-book。
# 这里只保留一个跳转页，让已经传播出去的旧链接不至于直接 404。
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: 部署跳转页
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 上传跳转页
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
